# 放到宿主机 /etc/nginx/conf.d/nginx-hinnflow.conf
# 主配置末尾有 include /etc/nginx/conf.d/*.conf; 会加载本文件，不会覆盖现有 novawander 站点。
# 改下面两处域名，并把证书放到对应目录后再 nginx -t && reload。
# Docker 须已在本机监听 5000。

server {
    listen       80;
    listen       [::]:80;
    server_name  canvas.hinnflow.com;

    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  canvas.hinnflow.com;

    ssl_certificate     /etc/nginx/domain/canvas.hinnflow.com_nginx/canvas.hinnflow.com_bundle.pem;
    ssl_certificate_key /etc/nginx/domain/canvas.hinnflow.com_nginx/canvas.hinnflow.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:50m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
