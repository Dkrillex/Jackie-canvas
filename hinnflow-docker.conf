# hinnflow 自建 Docker 部署的 nginx 配置。
#
# 和仓库根目录的 nginx.conf 并存、互不影响：
#   nginx.conf           上游开源版，纯静态前端
#   hinnflow-docker.conf 本文件，在上游基础上加 /new-api 反代、gzip 和静态资源缓存
#
# 由 docker-compose.hinnflow.yml 以 volume 方式挂载覆盖容器里的
# /etc/nginx/conf.d/default.conf，改完不用重新 build，docker compose restart web 即可生效。
#
# AI 请求不经过这里：浏览器直连 https://api.novawander.cn（上游允许跨域）。

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端 JS 产物接近 4MB，不压国内首屏很难看
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm font/woff font/woff2;

    # ---------- New API 登录鉴权 ----------
    # /new-api/api/user/login -> https://api.novawander.cn/api/user/login
    # 必须同源：登录靠会话 Cookie，而上游跨域返回的是 allow-origin: *，浏览器不允许带 Cookie。
    location /new-api/api/ {
        # 上游在 CDN 后面，IP 会变。proxy_pass 写死域名时 nginx 只在启动时解析一次，
        # 用变量 + resolver（Docker 内置 DNS）才会按 valid 周期重新解析。
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $new_api_host api.novawander.cn;
        rewrite ^/new-api(/api/.*)$ $1 break;
        proxy_pass https://$new_api_host;
        proxy_http_version 1.1;

        # 上游是 HTTPS 虚拟主机，漏了 SNI 必定握手失败。
        proxy_ssl_server_name on;
        proxy_ssl_name $new_api_host;
        proxy_set_header Host $new_api_host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 让上游别返回压缩流，避免和本 server 的 gzip 叠加
        proxy_set_header Accept-Encoding "";

        # 上游签发的 Cookie 带的是 api.novawander.cn，不改写浏览器会直接丢弃。
        proxy_cookie_domain api.novawander.cn $host;
        proxy_read_timeout 60s;
    }

    # 运行期配置由容器启动时的 40-runtime-config.sh 生成，必须禁缓存
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite 产物文件名自带 hash，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback。nginx 按最长前缀匹配，接口 location 不会被它吃掉，与书写顺序无关。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
