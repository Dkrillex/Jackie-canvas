# hinnflow 自建 Docker 部署的 nginx 配置。
#
# 和仓库根目录的 nginx.conf 并存、互不影响：
#   nginx.conf          上游开源版，纯静态前端，用户自带 API Key 浏览器直连
#   hinnflow-docker.conf 本文件，hinnflow 分支自建用，补齐 /gw、/new-api 与 /prod-api 反代
#
# 由 docker-compose.hinnflow.yml 以 volume 方式挂载覆盖容器里的
# /etc/nginx/conf.d/default.conf，所以改完不用重新 build 镜像，
# docker compose restart web 即可生效。

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 素材库上传走这里，默认 1m 会把稍大的图直接挡掉
    client_max_body_size 100m;

    # 前端 JS 产物接近 4MB，不压国内首屏很难看
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm font/woff font/woff2;

    # ---------- AI 网关 ----------
    # 等价于 Vercel 上的 api/gw.js。
    # /gw/v1/xxx  ->  https://api.novawander.cn/v1/xxx
    # proxy_pass 结尾那个斜杠负责剥掉 /gw 前缀，删了就会把 /gw 一起带给上游变成 404。
    location /gw/ {
        proxy_pass https://api.novawander.cn/;
        proxy_http_version 1.1;

        # 上游是 HTTPS 虚拟主机，漏了 SNI 必定握手失败。这是本文件最容易踩的一行。
        proxy_ssl_server_name on;
        proxy_set_header Host api.novawander.cn;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 让上游别返回压缩流，避免和本 server 的 gzip 叠加
        proxy_set_header Accept-Encoding "";

        # 对齐 api/gw.js 的 maxDuration 300
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 视频任务是流式/长响应，缓冲会拖慢首字节
        proxy_buffering off;
    }

    # ---------- New API 登录鉴权 ----------
    # /new-api/api/user/login -> https://api.novawander.cn/api/user/login
    location /new-api/ {
        proxy_pass https://api.novawander.cn/;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_set_header Host api.novawander.cn;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        proxy_cookie_domain api.novawander.cn $host;
        proxy_read_timeout 60s;
    }

    # ---------- MaaS 企业管理（不再用于登录）----------
    # 注意和 /gw、/new-api 相反：这里前缀要保留，proxy_pass 结尾不能加斜杠。
    location /prod-api/ {
        proxy_pass https://maas.gravitex.ai;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_set_header Host maas.gravitex.ai;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";

        # middleware.js 里 sanitizeSetCookie() 剥 Domain= 的等价物：
        # 上游签发的 cookie 带的是 maas.gravitex.ai，不改写浏览器会直接丢弃。
        proxy_cookie_domain maas.gravitex.ai $host;

        proxy_read_timeout 60s;
    }

    # ---------- 积分充值 / 接单服务（可选）----------
    # 等价于 Vercel 上的 api/pay.js，但这里转发到独立容器，不是内嵌进程。
    # 启用步骤见 docker-compose.hinnflow.yml 里的 pay 服务。
    # 同样要剥前缀：/pay-api/api/wallet/x -> pay:8787/api/wallet/x
    #
    # location /pay-api/ {
    #     proxy_pass http://pay:8787/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;
    # }

    # 运行期配置由容器启动时的 40-runtime-config.sh 生成，必须禁缓存
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Vite 产物文件名自带 hash，可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback 必须放在所有接口 location 之后，
    # 否则 /gw、/new-api、/prod-api 会被它吃掉，返回一页 HTML 而不是接口响应。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
