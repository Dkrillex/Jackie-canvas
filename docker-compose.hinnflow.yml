# hinnflow 自建 Docker 部署。与 docker-compose.yml / docker-compose.local.yml 并存，互不影响。
#
#   docker-compose.yml           上游开源版，拉 ghcr 上的公开镜像
#   docker-compose.local.yml     上游开源版，本地 build
#   docker-compose.hinnflow.yml  本文件，hinnflow 自建：前端（挂载 hinnflow-docker.conf）+ 充值服务 pay
#
# 用法：
#   docker compose -f docker-compose.hinnflow.yml up -d --build
# 改完 hinnflow-docker.conf 之后不用重新 build：
#   docker compose -f docker-compose.hinnflow.yml restart web

services:
  web:
    image: hinnflow-canvas:local
    build:
      context: .
      dockerfile: Dockerfile # 复用上游 Dockerfile，不改动它
    container_name: hinnflow-canvas
    # 只监听本机 5000，由宿主机 nginx（nginx-hinnflow.conf）对外提供 HTTPS。
    # macOS 的隔空播放接收器占用 5000，本机测试用 HINNFLOW_WEB_PORT=5001 docker compose ... 换端口。
    # 需要直接用 服务器IP:端口 访问时，去掉前面的 127.0.0.1:。
    ports:
      - "127.0.0.1:${HINNFLOW_WEB_PORT:-5000}:3000"
    volumes:
      # 覆盖镜像里那份上游 nginx.conf。只读挂载，容器改不到宿主机文件。
      - ./hinnflow-docker.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - pay

    # 统计分析（可选，默认关闭）。填了谁就启用谁，可同时启用多家。
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # 积分充值 / 注册（server/）。8787 只给同网络的 nginx 用，不映射到宿主机。
  # 常驻进程，兜底对账会一直跑。密钥和数据库账号放 server/.env（复制 server/.env.example），
  # 支付宝回调示例：
  #   ALIPAY_NOTIFY_URL=https://canvas.hinnflow.com/pay-api/api/pay/notify
  #   ALIPAY_RETURN_URL=https://canvas.hinnflow.com/wallet
  pay:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: hinnflow-canvas-pay
    env_file:
      - path: server/.env
        required: false
    environment:
      HOST: "0.0.0.0"
    restart: unless-stopped
