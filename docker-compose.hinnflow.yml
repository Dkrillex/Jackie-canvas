# hinnflow 自建 Docker 部署。与 docker-compose.yml / docker-compose.local.yml 并存，互不影响。
#
#   docker-compose.yml        上游开源版，拉 ghcr 上的公开镜像
#   docker-compose.local.yml  上游开源版，本地 build
#   docker-compose.hinnflow.yml  本文件，hinnflow 分支自建，补齐 /gw、/new-api 与 /prod-api 反代
#
# 用法：
#   docker compose -f docker-compose.hinnflow.yml up -d --build
# 改完 hinnflow-docker.conf 之后不用重新 build：
#   docker compose -f docker-compose.hinnflow.yml restart web

services:
  web:
    image: hinnflow-canvas:local
    build:
      context: .
      dockerfile: Dockerfile          # 复用现有 Dockerfile，不改动它
    container_name: hinnflow-canvas
    ports:
      - "3000:3000"
    volumes:
      # 覆盖镜像里那份上游 nginx.conf。只读挂载，容器改不到宿主机文件。
      - ./hinnflow-docker.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    # 启用 pay 服务时一起打开，否则 nginx 启动时解析不到 pay 这个主机名会直接退出
    # depends_on:
    #   - pay

    # 统计分析（可选，默认关闭）。填了谁就启用谁，可同时启用多家。
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # 积分充值 / 接单服务。不需要就整段留着注释，前端其余功能照常跑。
  #
  # 和 Vercel 上的形态不同：那边是 api/pay.js 把 server/dist/app.js import 进函数进程，
  # 没有常驻进程，兜底对账（RECONCILE_INTERVAL_SEC）实际上跑不起来。
  # 这里是独立容器常驻，对账才真正生效。
  #
  # 启用步骤：
  #   1. cp server/.env.example server/.env  并填好支付宝密钥与 MySQL
  #   2. 取消本段注释
  #   3. 取消 hinnflow-docker.conf 里 location /pay-api/ 那段注释
  #   4. 取消上面 web 服务的 depends_on 注释
  #   5. docker compose -f docker-compose.hinnflow.yml up -d --build
  #
  # pay:
  #   build:
  #     context: .
  #     dockerfile: server/Dockerfile
  #   container_name: hinnflow-canvas-pay
  #   env_file: server/.env
  #   restart: unless-stopped
  #   # 不映射端口：只给同网络的 nginx 用，不要暴露到公网。
  #   # 需要本机调试时再打开下面两行。
  #   # ports:
  #   #   - "127.0.0.1:8787:8787"
